# Ruff configuration for EXE-fingerprinter.
#
# target-version matches the Python used in CI (.github/workflows/ci.yml).
# Keeping it in one place avoids ruff flagging valid 3.12+ f-string syntax as a
# syntax error.
target-version = "py313"
line-length = 120
exclude = ["src/deps", ".venv", "__pycache__"]

[lint]
# F821 undefined name / F823 use-before-assignment / F811 redefinition.
# These are the classes of bug that pass compileall and then raise NameError at
# runtime, so they are enforced in CI rather than left as advisory output.
select = ["F821", "F823", "F811", "T201"]

[lint.per-file-ignores]
# main.py prints the --version/--help text; logger writes to stderr in debug.
"src/main.py" = ["T201"]
"src/utils/logger.py" = ["T201"]
