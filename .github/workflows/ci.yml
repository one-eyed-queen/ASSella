name: CI - Code Health & Syntax

on:
  push:
    branches: [ main, beta, canary ]
  pull_request:
    branches: [ main, beta, canary ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check src/ scripts/ --output-format=github

      - name: Install System Dependencies
        run: sudo apt-get update

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and Validate Python Syntax
        run: python -m compileall -q src/ scripts/

      # The gate. Imports every module under src/ AND force-resolves every
      # annotation — missing typing imports explode here, not in a frozen build.
      - name: Smoke Import Gate
        run: python -u scripts/smoke_import_check.py

      # Hermetic pre-release suite: smoke import, Qt-free runtime, settings
      # store, exe-pawprint destination, manifest-dump behaviour.
      - name: Pre-Release Check
        run: |
          PYTHONPATH=src python -u scripts/prerelease_check.py
